# Features tested
# Source:
# - 2D variable (T2)
# - isel domain subset
# Transform:
# - destagger along level (Z)
# - layers_to_pressure with native 3D pressure (TK, Z)
# Target:
# - anemoi workflow for analysis
mover:
  name: datamover
  batch_size: 1

directories:
  zarr: dataset.zarr
  cache: cache
  logs: logs

source:
  name: conus404
  uri: az://noaa/conus404.zarr
  time:
    start: 2017-01-01T00
    end: 2017-01-01T01
    freq: 1h

  variables:
    - T2
    - P
    - PSFC
    - TK
    - Z

  slices:
    isel:
      latitude: [400, 500]
      longitude: [400, 500]

transforms:
  destagger:
    Z: level
  layers_to_pressure:
    pressure_var: PSFC
    layer_pressure_var: P
    variables:
      TK: TK_pl
      Z: Z_pl
    levels_hpa: [500]

target:
  name: anemoi
  sort_channels_by_levels: True

  chunks:
    time: 1
    variable: -1
    ensemble: 1
    cell: -1

attrs:
  description: "This is a test dataset"
