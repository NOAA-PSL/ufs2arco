mover:
  name: datamover
  batch_size: 2

directories:
  zarr: dataset.zarr
  cache: cache
  logs: logs

source:
  name: gfs_archive
  t0:
    start: 2023-08-02T00
    end: 2023-08-02T06
    freq: 6h
  fhr:
    start: 0
    end: 5
    step: 1
  variables:
    - lsm
    - orog
    - sp
    - t2m
    - t
    - gh
    - q
    - prmsl
  levels:
    - 100
    - 500
    - 1000
  slices:
    sel:
      latitude: [89.9, -89.9]
target:
  name: anemoi
  forcings:
    - cos_latitude
    - sin_latitude
    - cos_longitude
    - sin_longitude
    - cos_julian_day
    - sin_julian_day
    - cos_local_time
    - sin_local_time
    - cos_solar_zenith_angle
    - insolation
  chunks:
    time: 1
    variable: -1
    ensemble: 1
    cell: -1
