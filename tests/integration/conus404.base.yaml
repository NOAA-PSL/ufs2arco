# Features tested
# Datamover:
# - serial
# Source:
# - analysis template
# - level selection
# - static variables
# - latitude slicing
# Transform:
# - divide
# - round mapping, with variables as str
# Target:
# - base workflow for analysis
# - rename
mover:
  name: datamover
  batch_size: 2

directories:
  zarr: dataset.zarr
  cache: cache
  logs: logs

source:
  name: conus404
  uri: az://noaa/conus404.zarr
  time:
    start: 2017-01-01T00
    end: 2017-01-01T06
    freq: 1h

  variables:
    - P
    - T2
    - TK
    - Z

  levels:
    - 100
    - 150
    - 200
    - 250
    - 500
    - 850
    - 1000

  slices:
    sel:
      latitude: [17.647308349609375, 57.34341812133789]

transforms:
  divide:
    geopotential_at_surface: 9.80665
  mappings:
    round: land_sea_mask

target:
  name: analysis
  rename:
    level: pressure
    geopotential_at_surface: orography
  chunks:
    time: 1
    pressure: 1
    latitude: -1
    longitude: -1
